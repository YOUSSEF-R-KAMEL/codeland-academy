@if (toast(); as currentToast) {
  <div
    [class]="
      'fixed top-5 z-[100] w-[calc(100%-2.5rem)] max-w-sm animate-toast-in ' +
      (currentLang === 'ar' ? 'right-5' : 'left-5')
    "
    role="status"
    aria-live="polite"
  >
    <div
      class="flex items-start gap-3 rounded-xl border px-4 py-3 shadow-lg"
      [ngClass]="styles().container"
    >
      <span
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-white text-sm font-bold"
        [ngClass]="styles().icon"
      >
        {{ styles().symbol }}
      </span>

      <p class="flex-1 pt-0.5 text-sm font-medium">
        {{ currentToast.message | translate }}
      </p>

      <button
        type="button"
        class="rounded-md px-1 text-lg leading-none opacity-60 transition hover:opacity-100"
        aria-label="Dismiss notification"
        (click)="dismiss()"
      >
        &times;
      </button>
    </div>
  </div>
}
